<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0C1A15" />
  <meta name="description" content="Détail d'une valeur ViewCEMAC — cours, variation, volume, historique." />
  <title>ViewCEMAC — Détail</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icons/viewcemac-icon-192.png" />
  <link rel="icon" href="icons/viewcemac-icon-192.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <style>
    .detail-top { display: flex; align-items: center; gap: 12px; padding: 20px 18px 0; }
    .detail-back { background: var(--panel-2); border: 1px solid var(--border); color: var(--gold);
      font-family: 'IBM Plex Sans', sans-serif; font-size: 0.85rem; font-weight: 600;
      padding: 8px 16px; border-radius: 999px; cursor: pointer; text-decoration: none; }
    .detail-id { display: flex; align-items: center; gap: 14px; padding: 24px 18px 8px; }
    .detail-id .m-row__avatar { width: 56px; height: 56px; font-size: 1.1rem; border-radius: 16px; }
    .detail-figures { padding: 4px 18px 14px; }
    .detail-figures .hero-price { font-size: 2.2rem; }
    .d-chart-wrap { margin: 0 12px; background: var(--panel); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 14px; }
    .d-chart-title { font-size: 0.72rem; letter-spacing: 0.1em; text-transform: uppercase;
      color: var(--dim); margin-bottom: 8px; }
    #d-chart { width: 100%; height: 160px; display: block; }
    .info-rows { padding: 12px; display: flex; flex-direction: column; gap: 8px; }
    .info-row { display: flex; justify-content: space-between; align-items: center;
      background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius);
      padding: 13px 14px; font-size: 0.88rem; }
    .info-row span:first-child { color: var(--dim); }
    .info-row span:last-child { font-family: 'IBM Plex Mono', monospace; font-weight: 600; }
    .detail-note { display: none; margin: 12px; padding: 12px 14px; font-size: 0.78rem;
      color: var(--dim); border: 1px dashed var(--border); border-radius: var(--radius); }
  </style>
</head>
<body>
  <header class="app-header">
    <div class="detail-top" style="padding:0">
      <a class="detail-back" href="/">← Retour</a>
      <span class="brand-name" style="font-family:'Fraunces',serif;font-weight:700">Détail</span>
    </div>
  </header>

  <main>
    <section class="detail-id">
      <div class="m-row__avatar" id="d-avatar">—</div>
      <div>
        <p class="hero-name" id="d-name" style="font-size:1.4rem;margin:0">—</p>
        <p class="hero-note" id="d-market" style="margin:2px 0 0">—</p>
      </div>
    </section>

    <section class="detail-figures">
      <span class="hero-price" id="d-price">—</span>
      <span class="hero-change flat" id="d-change">—</span>
    </section>

    <!-- ✅ #13 : sparkline d'historique (canvas, dessiné par detail.js) -->
    <section class="d-chart-wrap" id="d-chart-wrap" style="display:none">
      <p class="d-chart-title">Historique</p>
      <canvas id="d-chart" height="160" aria-label="Graphique d'historique du cours"></canvas>
    </section>

    <p class="detail-note" id="d-chart-note">📊 L'historique se construit progressivement — reviens dans quelques heures pour voir la courbe.</p>

    <!-- ✅ #17 : alertes de prix + notifications push -->
    <section class="d-chart-wrap" id="alerte-section">
      <p class="d-chart-title">🎯 Alerte sur cette valeur</p>
      <button class="detail-back" id="btn-notif" type="button">🔔 Activer les notifications</button>
      <div id="alerte-form" style="display:none;margin-top:10px">
        <div style="display:flex;gap:8px;flex-wrap:wrap">
          <select id="alerte-direction" style="flex:1;min-width:120px;background:var(--panel-2);border:1px solid var(--border);color:var(--text);border-radius:10px;padding:10px;font-family:'IBM Plex Sans',sans-serif">
            <option value="au-dessus">Au-dessus de</option>
            <option value="en-dessous">En dessous de</option>
          </select>
          <input type="number" id="alerte-prix" placeholder="Prix cible" min="1" step="any"
                 style="flex:1;min-width:110px;background:var(--panel-2);border:1px solid var(--border);color:var(--text);border-radius:10px;padding:10px;font-family:'IBM Plex Mono',monospace" />
          <button class="detail-back" id="alerte-creer" type="button" style="flex:1;min-width:110px;text-align:center">Créer l'alerte</button>
        </div>
      </div>
      <p id="alerte-msg" style="font-size:0.8rem;margin-top:8px;color:var(--gold)"></p>
      <div id="alerte-liste" style="margin-top:10px;display:flex;flex-direction:column;gap:6px"></div>
    </section>

    <section class="info-rows" id="d-info" aria-live="polite"></section>
  </main>

  <script src="detail.js"></script>
</body>
</html>
