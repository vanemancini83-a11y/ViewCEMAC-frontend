<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0F2B22" />
  <title>ViewCEMAC — Hors ligne</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="icons/viewcemac-icon-192.png" />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="auth-body">
  <main class="auth-main">
    <div class="auth-brand">
      <div class="brand-row">
        <span class="brand-mark" aria-hidden="true">◆</span>
        <span class="brand-name">ViewCEMAC</span>
      </div>
      <span class="brand-slogan">Le regard sur les marchés CEMAC</span>

    <div class="auth-card">
      <p class="auth-subtitle">Tu es hors ligne</p>
      <p class="auth-hint">Vérifie ta connexion internet puis recharge la page pour voir les cotations en direct.</p>
      <button class="auth-submit" onclick="location.reload()">Réessayer</button>
    </div>
  </main>
</body>
</html>
